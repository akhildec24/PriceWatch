{% extends 'base.html' %}

{% block title %}Sign in — PriceWatch{% endblock %}

{% block content %}
<div class="auth-page">
    <h1 class="auth-page__title">Sign in</h1>
    <form method="post" class="auth-page__form">
        {% csrf_token %}
        <div class="form-group">
            <label for="{{ form.username.id_for_label }}">Email</label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}
        </div>
        {% if form.errors %}
            <div class="message message--error mb-md">Invalid email or password.</div>
        {% endif %}
        <button type="submit" class="btn btn--primary" style="width: 100%;">Sign in</button>
    </form>
    <div class="auth-page__footer">
        Don't have an account? <a href="{% url 'register' %}">Register</a>
    </div>
</div>
{% endblock %}
